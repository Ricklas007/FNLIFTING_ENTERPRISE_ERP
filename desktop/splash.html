<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline' 'self'; script-src 'unsafe-inline' 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FNLIFTING ENTERPRISE ERP</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, Segoe UI, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #eaf6ff;
        background:
          radial-gradient(circle at 50% 0%, rgba(16, 119, 255, .42), transparent 38%),
          radial-gradient(circle at 18% 72%, rgba(0, 120, 255, .18), transparent 35%),
          linear-gradient(145deg, #020817 0%, #031331 52%, #020714 100%);
      }
      body::before {
        content: "";
        position: fixed;
        inset: -25%;
        background-image:
          linear-gradient(rgba(33, 148, 255, .08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(33, 148, 255, .08) 1px, transparent 1px);
        background-size: 44px 44px;
        transform: perspective(800px) rotateX(62deg);
        animation: drift 6s linear infinite;
      }
      main {
        position: relative;
        width: min(620px, calc(100vw - 56px));
        padding: 44px 46px 40px;
        text-align: center;
        border: 1px solid rgba(89, 169, 255, .24);
        border-radius: 28px;
        background: rgba(3, 14, 35, .76);
        box-shadow: 0 34px 90px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
        backdrop-filter: blur(18px);
      }
      img {
        width: min(380px, 76vw);
        filter: drop-shadow(0 0 34px rgba(26, 137, 255, .62));
        animation: pulse 2.2s ease-in-out infinite;
      }
      h1 {
        margin: 24px 0 10px;
        font-size: 22px;
        letter-spacing: .22em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        color: #88a8ca;
        font-size: 13px;
      }
      .loader {
        position: relative;
        height: 5px;
        margin: 30px auto 0;
        overflow: hidden;
        border-radius: 10px;
        background: rgba(83, 135, 194, .16);
      }
      .loader::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #26a7ff, #0a67ff, transparent);
        animation: load 1.3s ease-in-out infinite;
      }
      @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(250%); } }
      @keyframes pulse { 0%, 100% { transform: translateY(0); opacity: .94; } 50% { transform: translateY(-4px); opacity: 1; } }
      @keyframes drift { from { transform: perspective(800px) rotateX(62deg) translateY(0); } to { transform: perspective(800px) rotateX(62deg) translateY(44px); } }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/splash-logo.png" alt="FNLIFTING">
      <h1>FNLIFTING ENTERPRISE ERP</h1>
      <p id="startup-status">A preparar backend local, segurança e interface empresarial...</p>
      <div class="loader" aria-label="Carregando"></div>
    </main>
    <script>
      window.fnliftingDesktop?.onProgress?.((message) => {
        const target = document.getElementById('startup-status')
        if (target) target.textContent = message
      })
    </script>
  </body>
</html>
