name: FNLIFTING ERP CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-with-more-than-32-characters
      DATABASE_URL: sqlite:///./data/fnlifting_ci.db
      AUTO_CREATE_SCHEMA: "false"
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: alembic upgrade head
      - run: alembic current
      - run: alembic heads
      - run: python seed.py
      - run: pytest
      - run: python tools/preflight.py --json

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fnlifting_ci
          POSTGRES_USER: fnlifting
          POSTGRES_PASSWORD: fnlifting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fnlifting -d fnlifting_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-secret-key-with-more-than-32-characters
      DATABASE_URL: postgresql+psycopg://fnlifting:fnlifting_ci@localhost:5432/fnlifting_ci
      AUTO_CREATE_SCHEMA: "false"
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: alembic upgrade head
      - run: alembic current
      - run: alembic heads
      - run: python seed.py
      - run: pytest tests/test_sync_engine.py tests/test_payroll.py tests/test_tenant_isolation.py tests/test_public_certificate_validation.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  security-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Secret marker scan
        run: |
          if grep -RInE "(AIza[0-9A-Za-z_-]{20,}|sk_[0-9A-Za-z]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY)" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.runtime .; then
            echo "Potential secret found"
            exit 1
          fi
      - name: Docker compose config
        run: |
          SECRET_KEY=ci-secret-key-with-more-than-32-characters \
          BACKUP_ENCRYPTION_KEY=ci-backup-key-with-more-than-32-characters \
          DATABASE_URL=sqlite:////app/data/fnlifting.db \
          CORS_ORIGINS=http://localhost:8080 \
          ALLOWED_HOSTS=backend,localhost,127.0.0.1 \
          STORAGE_PROVIDER=LOCAL \
          STORAGE_BUCKET=fnlifting-ci \
          docker compose -f docker-compose.yml config >/tmp/fnlifting-compose.yml
      - name: Docker compose staging config
        run: |
          SECRET_KEY=ci-secret-key-with-more-than-32-characters \
          BACKUP_ENCRYPTION_KEY=ci-backup-key-with-more-than-32-characters \
          POSTGRES_PASSWORD=ci-postgres-password \
          MINIO_ROOT_PASSWORD=ci-minio-password-with-length \
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config >/tmp/fnlifting-compose-staging.yml
